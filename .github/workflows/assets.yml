# F9 X10: GitHub 호스트에서 원본부터 다시 굽고 검수 후보만 올린다. 커밋·배포는 하지 않는다.
name: 장식 에셋 굽기

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  modern-history:
    runs-on: macos-15
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      # U-04·ADR-050에서 설치·검증한 판. 최신판으로 자동 갱신하지 않는다.
      BLENDER_VERSION: 5.2.3
      BLENDER_SHA256: acc05374485a272342d4b323c15ac01953e7f697da2f1bad8af9c3bf087267a4
      KTX_VERSION: 4.4.2
      KTX_SHA256: 500bd8f9d63358c3f3a0d83b724c8574436a72c37dc0e4bad90ec1ca38032c3c
      # 로컬·self-hosted에는 적용되지 않는다. 보호기 실행 표시는 위조하지 않는다.
      ASSETS_GITHUB_HOSTED: '1'
      ASSETS_REBUILD_ALL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 러너 확인과 의존성 설치
        run: |
          set -euo pipefail
          mkdir -p .local/art/ci/logs
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$(uname -m)" = arm64
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            node --version
            npm --version
          } | tee .local/art/ci/logs/environment.txt
          npm ci --no-audit --no-fund 2>&1 | tee .local/art/ci/logs/npm-ci.log

      - name: 공식 Blender와 KTX 내려받기 및 SHA-256 확인
        run: |
          set -euo pipefail
          blender_dmg="$RUNNER_TEMP/blender-$BLENDER_VERSION-macos-arm64.dmg"
          blender_url="https://download.blender.org/release/Blender5.2/blender-$BLENDER_VERSION-macos-arm64.dmg"
          ktx_pkg="$RUNNER_TEMP/KTX-Software-$KTX_VERSION-Darwin-arm64.pkg"
          ktx_url="https://github.com/KhronosGroup/KTX-Software/releases/download/v$KTX_VERSION/KTX-Software-$KTX_VERSION-Darwin-arm64.pkg"
          curl --fail --location --show-error --retry 3 --connect-timeout 30 --max-time 900 "$blender_url" --output "$blender_dmg"
          curl --fail --location --show-error --retry 3 --connect-timeout 30 --max-time 900 "$ktx_url" --output "$ktx_pkg"
          {
            printf '%s\n%s\n' "$blender_url" "$ktx_url"
            printf '%s  %s\n' "$BLENDER_SHA256" "$blender_dmg" | shasum -a 256 --check
            printf '%s  %s\n' "$KTX_SHA256" "$ktx_pkg" | shasum -a 256 --check
            shasum -a 256 "$blender_dmg" "$ktx_pkg"
          } | tee .local/art/ci/logs/downloads.txt

      - name: 러너 임시 폴더에 도구 준비
        run: |
          set -euo pipefail
          mount_point="$RUNNER_TEMP/gallerywalk-blender-mount"
          mkdir -p "$mount_point" "$RUNNER_TEMP/gallerywalk-blender"
          hdiutil attach "$RUNNER_TEMP/blender-$BLENDER_VERSION-macos-arm64.dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          ditto "$mount_point/Blender.app" "$RUNNER_TEMP/gallerywalk-blender/Blender.app"
          installed_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/gallerywalk-blender/Blender.app/Contents/Info.plist")"
          test "$installed_version" = "$BLENDER_VERSION"
          # 작업 수준 env에서는 runner 문맥을 못 쓰므로 여기서 다음 단계로 넘긴다
          BLENDER_BIN="$RUNNER_TEMP/gallerywalk-blender/Blender.app/Contents/MacOS/Blender"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"
          # pkg 설치·sudo 없이 푼다. bin과 lib의 상대 경로를 유지한다(ADR-050).
          ktx_root="$RUNNER_TEMP/gallerywalk-ktx"
          pkgutil --expand-full "$RUNNER_TEMP/KTX-Software-$KTX_VERSION-Darwin-arm64.pkg" "$ktx_root"
          # pkg가 도구(bin)와 라이브러리(lib)를 다른 하위 꾸러미로 풀어 ktx가 @rpath(../lib)의 libktx를 못 찾는다.
          # 두 하위 꾸러미의 usr/local/{bin,lib}를 한 접두 폴더로 모은다.
          ktx_prefix="$RUNNER_TEMP/gallerywalk-ktx-prefix"
          mkdir -p "$ktx_prefix/bin" "$ktx_prefix/lib"
          find "$ktx_root" -type d -path '*/Payload/usr/local/bin' -exec ditto {} "$ktx_prefix/bin" \;
          find "$ktx_root" -type d -path '*/Payload/usr/local/lib' -exec ditto {} "$ktx_prefix/lib" \;
          ktx_bin="$ktx_prefix/bin/ktx"
          test -x "$ktx_bin"
          test -n "$(find "$ktx_prefix/lib" -name 'libktx.4*.dylib' -print -quit)"
          echo "$ktx_prefix/bin" >> "$GITHUB_PATH"
          {
            "$BLENDER_BIN" --version
            "$ktx_bin" --version
          } | tee .local/art/ci/logs/tools.txt

      - name: 배치 계약과 Blender 실내·외관 원본 다시 만들기
        run: |
          set -euo pipefail
          node tools/assets/pipeline/contract.mjs .local/art/build/modern-history 2>&1 | tee .local/art/ci/logs/contract.log
          # 설비는 다음 assets:build가 굽는다. 기본 표본 512·천장 배수 등 품질값을 그대로 쓴다.
          "$BLENDER_BIN" -b --factory-startup --python-exit-code 1 -P tools/assets/blender/build.py -- --out .local/art/build/modern-history --only core,exterior 2>&1 | tee .local/art/ci/logs/originals.log

      - name: 설비 굽기·전체 최적화·verifyOutput 예산 검사·검수 그림
        run: |
          set -euo pipefail
          npm run --prefix tools/assets assets:build 2>&1 | tee .local/art/ci/logs/assets-build.log

      - name: 예산 출력과 검수 후보 모으기
        run: |
          set -euo pipefail
          # finish.mjs가 실행한 예산 검사의 출력을 보존한다. 같은 후보를 다시 검사하지 않는다.
          awk '/^\[core.glb\]$/ { printing=1 } printing { print } /^\[verify\]/ { exit }' .local/art/ci/logs/assets-build.log > .local/art/ci/budget.txt
          grep -F '[verify] modern-history 통과' .local/art/ci/budget.txt
          mkdir -p .local/art/ci/candidate/apps/web/src/tpl .local/art/ci/renders
          for image in poster template-card; do
            test -s "apps/web/src/tpl/modern-history/$image.png"
          done
          ditto apps/web/src/tpl/modern-history .local/art/ci/candidate/apps/web/src/tpl/modern-history
          for image in .local/art/build/f9-x2-*/candidate/decorations.png; do
            test -s "$image"
            cp "$image" .local/art/ci/renders/decorations.png
          done
          {
            printf '장식 에셋 검수 후보 준비 완료\n\n'
            printf 'Blender %s / KTX-Software %s\n\n' "$BLENDER_VERSION" "$KTX_VERSION"
            printf '```text\n'
            cat .local/art/ci/budget.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 검수 후보와 실행 기록 아티팩트 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-history-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/art/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
